# SAM 2.1 only; existing RoboCine/ROS/Isaac environments are independent.
name: sam2
variables:
  PYTHONNOUSERSITE: "1"
  PYTHONPATH: ""
channels:
  - nvidia
  - defaults
dependencies:
  - python=3.11
  - pip
  - setuptools<81
  - wheel
  - ninja
  - cuda-nvcc=12.8
  - cuda-cudart-dev=12.8
  - cuda-cccl=12.8
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.11.0+cu128
      - torchvision==0.26.0+cu128
      - numpy>=1.24.4,<3
      - hydra-core>=1.3.2,<1.4
      - iopath>=0.1.10
      - pillow>=9.4.0
      - tqdm>=4.66.1
      - matplotlib>=3.9.1
      - opencv-python>=4.7.0
      - eva-decord>=0.6.1
